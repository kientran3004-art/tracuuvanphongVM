<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tra cứu văn phòng – Bưu chính Văn Minh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--panel:#fff;--ink:#13242b;--mute:#5b6d73;--line:#d6dfdd;--brand:#0d5663;--brand-ink:#fff;--soft:#dcebea;--open:#1b7a46;--shut:#a8372b;--warn:#fff3cf;--warnink:#6b4b00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1e;--panel:#15262b;--ink:#e6efee;--mute:#9db1b5;--line:#27403f;--brand:#4fb3c2;--brand-ink:#08161a;--soft:#1c3a3e;--open:#52c486;--shut:#ee8576;--warn:#3a3012;--warnink:#f1d68a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a1e;--panel:#15262b;--ink:#e6efee;--mute:#9db1b5;--line:#27403f;--brand:#4fb3c2;--brand-ink:#08161a;--soft:#1c3a3e;--open:#52c486;--shut:#ee8576;--warn:#3a3012;--warnink:#f1d68a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto}
h1{margin:0 0 10px;font-size:20px;font-weight:700;letter-spacing:-.01em}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0}
.search{position:relative}
.search input{width:100%;height:46px;padding:0 44px 0 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);font-size:16px}
.search input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--soft)}
.search button{position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;border-radius:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip em{font-style:normal;opacity:.65;margin-left:4px}
.sep{flex:none;width:1px;background:var(--line);margin:2px 4px}
main.wrap{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:16px;padding:12px 16px 40px;align-items:start}
.count{font-size:13px;color:var(--mute);margin:2px 2px 8px}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:block;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
.row:hover{border-color:var(--brand)}
.row[aria-current="true"]{border-color:var(--brand);border-left-color:var(--brand);background:var(--soft)}
.row b{display:block;font-weight:600}
.row .meta{font-size:12.5px;color:var(--mute)}
.row .addr{font-size:13px;color:var(--mute);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row mark{background:var(--warn);color:var(--warnink);border-radius:3px;padding:0 2px}
.hit{margin-top:4px;font-size:12.5px;color:var(--ink)}
.st{font-size:12px;font-weight:600;white-space:nowrap}
.st::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:currentColor}
.st.o{color:var(--open)}.st.c{color:var(--shut)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,160px) + 12px)}
.detail h2{margin:0;font-size:24px;letter-spacing:-.015em;line-height:1.2}
.detail .kv{color:var(--mute);font-size:14px;margin-bottom:2px}
.upd{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:var(--warn);color:var(--warnink);font-size:13.5px}
.svcs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.svc{font-size:12.5px;padding:3px 10px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink)}
.hn{color:var(--shut);font-weight:600}
.svc.off{background:none;border-color:var(--line);color:var(--mute);text-decoration:line-through}
dl{margin:10px 0 0;display:grid;grid-template-columns:150px 1fr;gap:0}
dt,dd{margin:0;padding:10px 0;border-top:1px solid var(--line)}
dt{color:var(--mute);font-size:13.5px;padding-right:12px}
dd{white-space:pre-wrap;overflow-wrap:anywhere;max-width:70ch}
.sub{display:block}.sub b{font-weight:600;color:var(--mute);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;margin:0 6px 6px 0;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.link{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;cursor:pointer;font-size:13px}
.empty{padding:36px 12px;text-align:center;color:var(--mute)}
.back{display:none}
.foot{max-width:1180px;margin:0 auto;padding:0 16px 24px;color:var(--mute);font-size:12.5px}
@media (max-width:820px){
 main.wrap{grid-template-columns:1fr;padding-top:10px}
 .detail{position:fixed;inset:0;z-index:40;border-radius:0;border:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(100%);visibility:hidden;transition:transform .2s}
 .detail.show{transform:none;visibility:visible}
 .back{display:inline-flex;margin-bottom:10px}
 dl{grid-template-columns:1fr}dt{padding-bottom:0;border-bottom:0}dd{border-top:0;padding-top:2px}
}
@media (prefers-reduced-motion:reduce){.detail{transition:none}}
</style>
</head>

const $=s=>document.querySelector(s);
const norm=s=>[...String(s||"").toLowerCase()].map(c=>c==="đ"?"d":c.normalize("NFD")[0]).join("");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SV=["Giao hàng tại VP","Nhận hàng tại VP","Giao tại nhà","Nhận tại nhà"];
DATA.forEach((o,i)=>{o.id=i;const p=o.name.split(" · ");o.title=p[0].trim();o.extra=p.slice(1).join(" · ");
 o.tels=[];for(const m of o.phone.matchAll(/\d[\d.,\u00a0 ]{6,}\d/g)){let d=m[0].replace(/\D/g,"");if(d[0]!=="0")d="0"+d;while(d.length>=10){const n=d.startsWith("02")?11:10;o.tels.push(d.slice(0,n));d=d.slice(n)}if(d.length===9)o.tels.push(d)}o.tels=o.tels.filter(d=>d.length>=9);
 o.idx={name:norm(o.title+" "+o.extra),addr:norm(o.addr+" "+o.addrNew),tel:o.phone.replace(/\D/g,""),scope:norm(o.scope+" "+o.home+" "+o.note+" "+o.kv)};
 o.ranges=ranges(o.open)});
function ranges(t){if(/24\s*\/\s*24/.test(t))return"all";const r=[];for(const m of t.matchAll(/(\d{1,2})\s*[hH:]\s*(\d{2})?\s*[-–]\s*(\d{1,2})\s*[hH:]\s*(\d{2})?/g))r.push([+m[1]*60+(+m[2]||0),+m[3]*60+(+m[4]||0)]);if(r.length)return r;const q=[...t.matchAll(/(\d{1,2})\s*[hH]\s*(\d{2})?/g)];return q.length===2?[[+q[0][1]*60+(+q[0][2]||0),+q[1][1]*60+(+q[1][2]||0)]]:null}
function nowMin(){const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Ho_Chi_Minh",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());return+p[0].value%24*60+ +p[2].value}
function status(o){const r=o.ranges;if(!r)return null;if(r==="all")return{o:1,t:"Mở cả ngày"};const n=nowMin();const h=r.find(x=>n>=x[0]&&n<x[1]);const f=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");return h?{o:1,t:"Đang mở · đến "+f(h[1])}:{o:0,t:"Đã đóng cửa"}}
const KVS=[...new Set(DATA.map(o=>o.kv))];
const F={kv:"",giao:false,nhan:false,mo:false,q:""};
let sel=-1,oldAddr=false;
function chips(){const mk=(l,k,v,n)=>`<button class="chip" data-k="${k}" data-v="${esc(v)}" aria-pressed="${k==="kv"?F.kv===v:F[k]}">${esc(l)}${n!=null?`<em>${n}</em>`:""}</button>`;
 $("#chips").innerHTML=mk("Tất cả","kv","",DATA.length)+KVS.map(k=>mk(k,"kv",k,DATA.filter(o=>o.kv===k).length)).join("")+'<span class="sep"></span>'+mk("Giao tại nhà","giao","1")+mk("Nhận tại nhà","nhan","1")+mk("Đang mở","mo","1")}
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const k=b.dataset.k;if(k==="kv")F.kv=b.dataset.v;else F[k]=!F[k];render()};
function find(){const t=norm(F.q).split(/\s+/).filter(Boolean);return DATA.map(o=>{if(F.kv&&o.kv!==F.kv)return null;if(F.giao&&!o.svc[2])return null;if(F.nhan&&!o.svc[3])return null;let st=null;if(F.mo){st=status(o);if(!st||!st.o)return null}
 let sc=0,hit=null;for(const w of t){const dig=w.replace(/\D/g,"");if(o.idx.name.includes(w))sc+=10;else if(o.idx.addr.includes(w))sc+=4;else if(dig.length>=4&&o.idx.tel.includes(dig))sc+=4;else{const i=o.idx.scope.indexOf(w);if(i<0)return null;sc+=1;hit=hit||[i,w.length]}}
 return{o,sc,hit}}).filter(Boolean).sort((a,b)=>b.sc-a.sc||a.o.id-b.o.id)}
function snippet(o,h){const s=o.scope+" "+o.home+" "+o.note+" "+o.kv;const a=Math.max(0,h[0]-30),b=Math.min(s.length,h[0]+h[1]+40);const x=s.slice(a,b).replace(/\s+/g," ");const off=h[0]-a;return(a?"…":"")+esc(x.slice(0,off))+"<mark>"+esc(x.slice(off,off+h[1]))+"</mark>"+esc(x.slice(off+h[1]))+(b<s.length?"…":"")}
function render(){chips();const res=find();$("#count").textContent=F.q||F.kv||F.giao||F.nhan||F.mo?res.length+" kết quả":DATA.length+" văn phòng";$("#clr").hidden=!F.q;
 $("#list").innerHTML=res.length?res.map(({o,hit})=>{const s=status(o);return`<button class="row" data-id="${o.id}" aria-current="${o.id===sel}"><span class="top"><b>${esc(o.title)}</b>${s?`<span class="st ${s.o?"o":"c"}">${s.o?"Mở":"Đóng"}</span>`:""}</span><span class="meta">${esc(o.kv)}${o.svc[2]&&o.svc[3]?` · <span class="hn">Có giao tại nhà và nhận tại nhà</span>`:o.svc[2]?" · có giao tại nhà":o.svc[3]?" · có nhận tại nhà":""}</span><span class="addr">${esc(o.addrNew||o.addr)}</span>${hit?`<span class="hit">${snippet(o,hit)}</span>`:""}</button>`}).join(""):'<div class="empty">Không tìm thấy văn phòng nào.<br>Thử bỏ dấu, gõ tên phường/xã, hoặc bỏ bớt bộ lọc.</div>';
 if(sel<0||!res.some(r=>r.o.id===sel)){if(!matchMedia("(max-width:820px)").matches)show(res.length?res[0].o.id:-1,true)}}
$("#list").onclick=e=>{const b=e.target.closest(".row");if(b)show(+b.dataset.id)};
function lines(a){const v=a.filter(x=>x.v);if(!v.length)return"";if(v.length===1)return esc(v[0].v);return v.map(x=>`<span class="sub"><b>${x.l}:</b> ${esc(x.v.replace(/\s*\n\s*/g," · "))}</span>`).join("")}
function mapBtn(o,addr){const u="https://www.google.com/maps/search/?api=1&query=";return`<div class="mapbtn" style="margin-top:8px">`+(o.lat!=null?`<a class="btn p" href="${u}${o.lat},${o.lng}" target="_blank" rel="noopener">Mở bản đồ</a>`:`<a class="btn" href="${u}${encodeURIComponent(addr)}" target="_blank" rel="noopener">Tìm trên bản đồ</a>`)+`</div>`}
function show(id,quiet){sel=id;const d=$("#detail");if(id<0){d.innerHTML='<div class="empty">Chọn một văn phòng để xem chi tiết.</div>';return}
 const o=DATA[id],s=status(o);const addr=oldAddr||!o.addrNew?o.addr:o.addrNew;
 const row=(l,h)=>h?`<dt>${l}</dt><dd>${h}</dd>`:"";
 const tel=o.tels.map(t=>`<a class="btn p" href="tel:${t}">Gọi ${t.replace(/^(\d{4})(\d{3})(\d+)$/,"$1 $2 $3")}</a><button class="btn" data-copy="${t}">Sao chép</button>`).join("");
 d.innerHTML=`<button class="btn back" id="bk">‹ Danh sách</button><div class="kv">${esc(o.kv)}</div><h2>${esc(o.title)}</h2>
 ${s?`<div class="st ${s.o?"o":"c"}" style="margin-top:6px">${s.t}</div>`:""}
 ${o.extra?`<div class="upd">${esc(o.extra)}</div>`:""}
 <div class="svcs">${SV.map((n,i)=>`<span class="svc${o.svc[i]?"":" off"}">${n}</span>`).join("")}</div>${o.svc[2]&&o.svc[3]?`<div class="hn" style="font-size:13.5px">Có giao tại nhà và nhận tại nhà</div>`:""}
 <dl>${row("Địa chỉ",esc(addr)+mapBtn(o,addr)+(o.addrNew&&o.addr&&o.addrNew!==o.addr?`<br><button class="link" id="sw">${oldAddr?"Xem địa chỉ sau sáp nhập":"Xem địa chỉ cũ"}</button>`:""))}
 ${row("Điện thoại",tel+(/[A-Za-zÀ-ỹ]/.test(o.phone.replace(/CPN|Vé/g,""))?`<div style="white-space:pre-wrap;color:var(--mute);font-size:13px">${esc(o.phone)}</div>`:""))}
 ${row("Giờ làm việc",esc(o.open))}
 ${row("Khuyến cáo giờ gửi hàng",lines([{l:"Sáng",v:o.adv[0]},{l:"Chiều – tối",v:o.adv[1]}]))}
 ${row("Báo nhận hàng tại nhà",lines([{l:"Sáng",v:o.notice[0]},{l:"Chiều – tối",v:o.notice[1]}]))}
 ${row("Giao hàng tại nhà",esc(o.home))}
 ${row("Phạm vi hoạt động",esc(o.scope))}
 ${row("Ghi chú",esc(o.note))}</dl>`;
 document.querySelectorAll(".row").forEach(r=>r.setAttribute("aria-current",+r.dataset.id===id));
 if(!quiet){d.classList.add("show");d.scrollTop=0;history.replaceState(null,"","#o"+id)}}
$("#detail").onclick=e=>{const t=e.target;if(t.id==="bk"){$("#detail").classList.remove("show");return}if(t.id==="sw"){oldAddr=!oldAddr;show(sel,true);return}
 if(t.dataset.copy){navigator.clipboard&&navigator.clipboard.writeText(t.dataset.copy).then(()=>{t.textContent="Đã chép"}).catch(()=>{})}};
$("#q").oninput=e=>{F.q=e.target.value;render()};
$("#clr").onclick=()=>{$("#q").value="";F.q="";render();$("#q").focus()};
const h=location.hash.match(/^#o(\d+)$/);render();if(h&&DATA[+h[1]])show(+h[1],!matchMedia("(max-width:820px)").matches);
const hd=document.querySelector("header");const setH=()=>document.documentElement.style.setProperty("--hh",hd.offsetHeight+"px");setH();addEventListener("resize",setH);
</script>
